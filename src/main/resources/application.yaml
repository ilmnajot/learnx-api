spring:
  application:
    name: learnx-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${LEARNX_DB_URL:jdbc:postgresql://localhost:5433/learnx}
    username: ${LEARNX_DB_USERNAME:learnx}
    password: ${LEARNX_DB_PASSWORD:learnx_dev}
    hikari:
      maximum-pool-size: ${LEARNX_DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mail:
    host: ${LEARNX_SMTP_HOST:}
    port: ${LEARNX_SMTP_PORT:587}
    username: ${LEARNX_SMTP_USERNAME:}
    password: ${LEARNX_SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${LEARNX_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${LEARNX_SMTP_STARTTLS:true}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Native means Tomcat reads X-Forwarded-For only from internal proxies, from the right, so visitors can't fake an
  # IP to dodge rate limits. If the reverse proxy isn't on a private network, set server.tomcat.remoteip.internal-proxies.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: uz.learnx.learnxapi.common.mybatis
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    default-statement-timeout: 10

management:
  health:
    # A mail outage must not mark the whole API unhealthy and get it restarted.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO

learnx:
  jwt:
    # Development-only default. Production must set LEARNX_JWT_SECRET (at least 32 characters).
    secret: ${LEARNX_JWT_SECRET:dev-only-secret-change-me-before-any-deployment}
    access-ttl: 15m
    refresh-ttl: 30d
    secure-cookie: ${LEARNX_SECURE_COOKIE:false}
  cors:
    # Development default: any local port. Production must list its exact origins.
    allowed-origins: ${LEARNX_ALLOWED_ORIGINS:http://localhost:*}
  ai:
    # With no API key, the built-in rule-based tutor is used.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${LEARNX_AI_MODEL:claude-opus-5-5}
    timeout: 30s
    daily-request-limit: ${LEARNX_AI_DAILY_LIMIT:50}
    # Ceiling across all learners per day. Also set a spending limit in the Anthropic console.
    global-daily-limit: ${LEARNX_AI_GLOBAL_DAILY_LIMIT:1000}
  mail:
    from: ${LEARNX_MAIL_FROM:LearnX <no-reply@localhost>}
    public-url: ${LEARNX_PUBLIC_URL:http://localhost:5173}
    require-smtp: false
  # Per IP address. Set high enough that an office sharing one address isn't blocked.
  rate-limit:
    register-per-hour: ${LEARNX_LIMIT_REGISTER:20}
    login-per-hour: ${LEARNX_LIMIT_LOGIN:60}
    refresh-per-hour: ${LEARNX_LIMIT_REFRESH:600}
    password-per-hour: ${LEARNX_LIMIT_PASSWORD:20}
    verify-per-hour: ${LEARNX_LIMIT_VERIFY:60}
    ai-per-hour: ${LEARNX_LIMIT_AI:300}
    comment-per-hour: ${LEARNX_LIMIT_COMMENT:30}
  admin:
    emails: ${LEARNX_ADMIN_EMAILS:}
  public-site:
    cache-ttl: 60s
